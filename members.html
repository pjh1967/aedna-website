<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 전용 — AEDNA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --board:#10241C; --paper:#F0EFE3; --paper-2:#E7E5D6; --ink:#14201B; --ink-soft:#4B564E;
    --copper:#B5651D; --line:rgba(20,32,27,0.14); --fs-scale:1;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);min-height:100vh;
    font-family:"Pretendard Variable","Pretendard",-apple-system,"Malgun Gothic",sans-serif;line-height:1.6;}
  a{color:inherit;}
  header{background:var(--board);color:var(--paper);padding:20px 32px;display:flex;
    align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:8px;text-decoration:none;}
  .brand-mark{width:22px;height:22px;flex:none;}
  .brand-text{font-size:calc(14px * var(--fs-scale));font-weight:600;color:var(--paper);}
  .logout-btn{font-size:calc(12.5px * var(--fs-scale));padding:8px 16px;border:1px solid rgba(240,239,227,0.3);
    border-radius:5px;background:none;color:var(--paper);cursor:pointer;}
  .logout-btn:hover{border-color:var(--paper);}
  main{max-width:640px;margin:0 auto;padding:64px 32px;}
  #gate{text-align:center;padding:80px 32px;color:var(--ink-soft);font-size:calc(14px * var(--fs-scale));}
  .hidden{display:none !important;}
  h1{font-size:calc(24px * var(--fs-scale));font-weight:600;margin:0 0 8px;}
  .welcome{font-size:calc(14px * var(--fs-scale));color:var(--ink-soft);margin:0 0 32px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:28px;margin-bottom:16px;}
  .card p{font-size:calc(14px * var(--fs-scale));color:var(--ink-soft);margin:0;}
  .danger-card{border-color:rgba(178,44,44,0.25);}
  .withdraw-btn{margin-top:14px;font-size:calc(12.5px * var(--fs-scale));padding:9px 18px;border:1px solid #B22C2C;
    border-radius:5px;background:none;color:#B22C2C;cursor:pointer;}
  .withdraw-btn:hover{background:#B22C2C;color:#fff;}
  .withdraw-btn:disabled{opacity:0.5;cursor:default;}
  @media(min-width:861px){:root{--fs-scale:1.12;}}
</style>
</head>
<body>

<div id="gate">확인 중...</div>

<div id="app" class="hidden">
  <header>
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 26 26" fill="none">
        <rect x="6" y="6" width="14" height="14" rx="1" stroke="#E3A467" stroke-width="1.6"/>
        <path d="M6 10H2M6 16H2M20 10H24M20 16H24M10 6V2M16 6V2M10 20V24M16 20V24" stroke="var(--paper)" stroke-width="1.4"/>
      </svg>
      <span class="brand-text">AEDNA</span>
    </a>
    <div style="display:flex;align-items:center;gap:10px;">
      <a href="admin.html" id="adminLink" class="logout-btn" style="display:none;text-decoration:none;">관리자 페이지</a>
      <button class="logout-btn" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <main>
    <h1>회원 전용 페이지</h1>
    <p class="welcome" id="welcomeMsg"></p>
    <div class="card">
      <p>이 페이지는 로그인한 회원에게만 표시됩니다. 앞으로 이 자리에 자료실, 행사 안내, 회원 명부 같은 콘텐츠를 채워나갈 예정입니다.</p>
    </div>

    <div class="card danger-card">
      <p style="color:var(--ink);font-weight:600;margin-bottom:4px;">회원 탈퇴</p>
      <p>탈퇴하시면 계정 및 회원 권한이 즉시 삭제되며 되돌릴 수 없습니다.</p>
      <button class="withdraw-btn" id="withdrawBtn">회원 탈퇴하기</button>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCREJ9SpCMgMQLndCKFetdBJmXelqF6YRA",
    authDomain: "aedna-a3146.firebaseapp.com",
    projectId: "aedna-a3146",
    storageBucket: "aedna-a3146.firebasestorage.app",
    messagingSenderId: "675277322776",
    appId: "1:675277322776:web:862cb60ccd4b0d649d216d"
  };
  firebase.initializeApp(firebaseConfig);

  // join.html과 동일한 Apps Script 배포 URL
  const SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyFFdEtgq0GwY-bhhHL4JRALM4Hd5WFIVFD6jCHzA6G07BRa5Xtnf23Z9vOepLRyQlO1w/exec';

  firebase.auth().onAuthStateChanged(async function(user){
    const gate = document.getElementById('gate');
    const app = document.getElementById('app');
    if (user && user.emailVerified) {
      let role = 'guest', status = '';
      try {
        const res = await fetch(SHEET_ENDPOINT + '?action=role&email=' + encodeURIComponent(user.email));
        const data = await res.json();
        role = (data.role || '').toLowerCase();
        status = data.status || '';
      } catch (err) {
        // 역할 조회 실패 시 일반 회원으로 취급
      }

      if (status === '탈퇴') {
        alert('관리자에 의해 탈퇴 처리된 계정입니다. 문의사항은 운영진에게 연락해 주세요.');
        await firebase.auth().signOut();
        location.href = 'login.html';
        return;
      }

      gate.classList.add('hidden');
      app.classList.remove('hidden');
      document.getElementById('welcomeMsg').textContent = user.email + ' 님, 환영합니다.';

      if (role === 'admin' || role === 'super admin') {
        document.getElementById('adminLink').style.display = 'inline-flex';
      }
    } else {
      location.href = 'login.html';
    }
  });

  document.getElementById('withdrawBtn').addEventListener('click', async function(){
    const user = firebase.auth().currentUser;
    if (!user) return;
    if (!confirm('정말 탈퇴하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;

    const btn = this;
    btn.disabled = true;
    btn.textContent = '처리 중...';

    try {
      const r = await fetch(SHEET_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ action: 'withdraw', requesterEmail: user.email })
      });
      const d = await r.json();
      if (!d.ok) {
        alert(d.error || '탈퇴 처리 중 오류가 발생했습니다.');
        btn.disabled = false;
        btn.textContent = '회원 탈퇴하기';
        return;
      }

      try {
        await user.delete();
      } catch (authErr) {
        // 재로그인이 필요한 경우 등: 시트 상태는 이미 탈퇴로 반영되었으므로 로그아웃만 진행
      }

      alert('탈퇴가 완료되었습니다. 그동안 이용해 주셔서 감사합니다.');
      await firebase.auth().signOut().catch(function(){});
      location.href = 'index.html';
    } catch (err) {
      alert('네트워크 오류로 탈퇴 처리에 실패했습니다.');
      btn.disabled = false;
      btn.textContent = '회원 탈퇴하기';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    firebase.auth().signOut().then(function(){
      location.href = 'login.html';
    });
  });
</script>

</body>
</html>
