<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 페이지 — AEDNA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --board:#10241C; --paper:#F0EFE3; --paper-2:#E7E5D6; --ink:#14201B; --ink-soft:#4B564E;
    --copper:#B5651D; --copper-light:#E3A467; --circuit:#1F6D4C; --danger:#B22C2C;
    --line:rgba(20,32,27,0.14); --fs-scale:1;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);min-height:100vh;
    font-family:"Pretendard Variable","Pretendard",-apple-system,"Malgun Gothic",sans-serif;line-height:1.6;}
  a{color:inherit;}
  header{background:var(--board);color:var(--paper);padding:20px 32px;display:flex;
    align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:8px;text-decoration:none;}
  .brand-mark{width:22px;height:22px;flex:none;}
  .brand-text{font-size:calc(14px * var(--fs-scale));font-weight:600;color:var(--paper);}
  .header-actions{display:flex;align-items:center;gap:10px;}
  .btn{font-size:calc(12.5px * var(--fs-scale));padding:8px 16px;border:1px solid rgba(240,239,227,0.3);
    border-radius:5px;background:none;color:var(--paper);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;}
  .btn:hover{border-color:var(--paper);}
  main{max-width:1080px;margin:0 auto;padding:48px 32px 96px;}
  #gate{text-align:center;padding:80px 32px;color:var(--ink-soft);font-size:calc(14px * var(--fs-scale));}
  #forbidden{display:none;text-align:center;padding:80px 32px;color:var(--danger);font-size:calc(14px * var(--fs-scale));}
  .hidden{display:none !important;}
  h1{font-size:calc(24px * var(--fs-scale));font-weight:600;margin:0 0 6px;}
  .sub{font-size:calc(13.5px * var(--fs-scale));color:var(--ink-soft);margin:0 0 32px;}
  .role-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;
    background:rgba(181,101,29,0.14);color:var(--copper);letter-spacing:0.02em;margin-left:8px;vertical-align:middle;}

  .table-wrap{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:calc(13px * var(--fs-scale));}
  thead th{text-align:left;padding:12px 14px;background:var(--paper-2);color:var(--ink-soft);
    font-weight:600;font-size:calc(11.5px * var(--fs-scale));letter-spacing:0.03em;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(181,101,29,0.04);}
  .name-cell{font-weight:600;}
  .email-cell{color:var(--ink-soft);font-size:calc(12.5px * var(--fs-scale));}

  select{padding:6px 10px;border:1px solid var(--line);border-radius:5px;background:var(--paper);
    color:var(--ink);font-size:calc(12.5px * var(--fs-scale));font-family:inherit;}
  .status-pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px;}
  .status-pill.대기{background:rgba(75,86,78,0.12);color:var(--ink-soft);}
  .status-pill.승인{background:rgba(31,109,76,0.12);color:var(--circuit);}
  .status-pill.거절{background:rgba(178,44,44,0.1);color:var(--danger);}

  .row-actions{display:flex;gap:6px;align-items:center;}
  .apply-btn{font-size:11.5px;padding:6px 12px;border-radius:5px;border:1px solid var(--copper);
    background:none;color:var(--copper);cursor:pointer;font-weight:600;}
  .apply-btn:hover{background:var(--copper);color:#1C0D02;}
  .apply-btn:disabled{opacity:0.4;cursor:default;}

  .empty{text-align:center;padding:48px;color:var(--ink-soft);font-size:13.5px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:12px 22px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:100;}
  .toast.show{opacity:1;}
  .toast.err{background:var(--danger);}
  @media(min-width:861px){:root{--fs-scale:1.05;}}
  @media(max-width:700px){
    main{padding:32px 16px 80px;}
    table{font-size:12px;}
    thead th, tbody td{padding:10px 8px;}
  }
</style>
</head>
<body>

<div id="gate">확인 중...</div>
<div id="forbidden">이 페이지는 관리자(admin) 이상만 접근할 수 있습니다.<br><a href="members.html" style="color:var(--copper);">회원 페이지로 돌아가기</a></div>

<div id="app" class="hidden">
  <header>
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 26 26" fill="none">
        <rect x="6" y="6" width="14" height="14" rx="1" stroke="#E3A467" stroke-width="1.6"/>
        <path d="M6 10H2M6 16H2M20 10H24M20 16H24M10 6V2M16 6V2M10 20V24M16 20V24" stroke="var(--paper)" stroke-width="1.4"/>
      </svg>
      <span class="brand-text">AEDNA</span>
    </a>
    <div class="header-actions">
      <a class="btn" href="members.html">회원 페이지</a>
      <button class="btn" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <main>
    <h1>관리자 페이지<span class="role-badge" id="myRoleBadge"></span></h1>
    <p class="sub" id="pageDesc">가입 신청 현황을 확인하고 상태를 승인할 수 있습니다.</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>이름 / 소속</th>
            <th>이메일</th>
            <th>연락처</th>
            <th>상태</th>
            <th>역할</th>
            <th>상태 처리</th>
            <th id="roleColHeader" style="display:none;">권한 부여</th>
          </tr>
        </thead>
        <tbody id="memberRows">
        </tbody>
      </table>
      <div class="empty" id="emptyMsg" style="display:none;">신청 내역이 없습니다.</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCREJ9SpCMgMQLndCKFetdBJmXelqF6YRA",
    authDomain: "aedna-a3146.firebaseapp.com",
    projectId: "aedna-a3146",
    storageBucket: "aedna-a3146.firebasestorage.app",
    messagingSenderId: "675277322776",
    appId: "1:675277322776:web:862cb60ccd4b0d649d216d"
  };
  firebase.initializeApp(firebaseConfig);

  // join.html / members.html과 동일한 Apps Script 배포 URL
  const SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyFFdEtgq0GwY-bhhHL4JRALM4Hd5WFIVFD6jCHzA6G07BRa5Xtnf23Z9vOepLRyQlO1w/exec';

  let currentUserEmail = '';
  let currentUserRole = '';

  function showToast(msg, isErr){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  function statusOptions(current){
    const opts = ['대기','승인','거절'];
    return opts.map(function(o){
      return '<option value="' + o + '"' + (o === current ? ' selected' : '') + '>' + o + '</option>';
    }).join('');
  }

  function roleOptions(current){
    const opts = ['guest','Member','admin'];
    return opts.map(function(o){
      return '<option value="' + o + '"' + (o.toLowerCase() === String(current).toLowerCase() ? ' selected' : '') + '>' + o + '</option>';
    }).join('');
  }

  async function loadMembers(){
    const tbody = document.getElementById('memberRows');
    const emptyMsg = document.getElementById('emptyMsg');
    tbody.innerHTML = '';

    const res = await fetch(SHEET_ENDPOINT + '?action=list&requesterEmail=' + encodeURIComponent(currentUserEmail));
    const data = await res.json();
    if (!data.ok) { showToast(data.error || '목록을 불러오지 못했습니다.', true); return; }

    const isSuper = currentUserRole.toLowerCase() === 'super admin';
    document.getElementById('roleColHeader').style.display = isSuper ? '' : 'none';

    if (!data.members.length) { emptyMsg.style.display = 'block'; return; }
    emptyMsg.style.display = 'none';

    data.members.forEach(function(m){
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><div class="name-cell">' + (m.name || '-') + '</div>' +
          '<div class="email-cell">' + (m.organization || '') + '</div></td>' +
        '<td class="email-cell">' + (m.email || '-') + '</td>' +
        '<td>' + (m.phone || '-') + '</td>' +
        '<td><span class="status-pill ' + (m.status || '대기') + '">' + (m.status || '대기') + '</span></td>' +
        '<td>' + (m.role || 'guest') + '</td>' +
        '<td>' +
          '<div class="row-actions">' +
            '<select class="statusSelect">' + statusOptions(m.status) + '</select>' +
            '<button class="apply-btn statusApply">적용</button>' +
          '</div>' +
        '</td>' +
        '<td style="' + (isSuper ? '' : 'display:none;') + '">' +
          '<div class="row-actions">' +
            '<select class="roleSelect">' + roleOptions(m.role) + '</select>' +
            '<button class="apply-btn roleApply">적용</button>' +
          '</div>' +
        '</td>';

      tr.querySelector('.statusApply').addEventListener('click', async function(){
        const btn = this;
        const newStatus = tr.querySelector('.statusSelect').value;
        btn.disabled = true;
        try {
          const r = await fetch(SHEET_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              action: 'approve',
              requesterEmail: currentUserEmail,
              targetEmail: m.email,
              status: newStatus
            })
          });
          const d = await r.json();
          if (d.ok) { showToast(m.name + ' 님 상태가 "' + newStatus + '"(으)로 변경되었습니다.'); loadMembers(); }
          else { showToast(d.error || '처리 실패', true); }
        } catch (err) { showToast('네트워크 오류', true); }
        finally { btn.disabled = false; }
      });

      const roleApplyBtn = tr.querySelector('.roleApply');
      if (roleApplyBtn) {
        roleApplyBtn.addEventListener('click', async function(){
          const btn = this;
          const newRole = tr.querySelector('.roleSelect').value;
          btn.disabled = true;
          try {
            const r = await fetch(SHEET_ENDPOINT, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                action: 'grantAdmin',
                requesterEmail: currentUserEmail,
                targetEmail: m.email,
                role: newRole
              })
            });
            const d = await r.json();
            if (d.ok) { showToast(m.name + ' 님 역할이 "' + newRole + '"(으)로 변경되었습니다.'); loadMembers(); }
            else { showToast(d.error || '처리 실패', true); }
          } catch (err) { showToast('네트워크 오류', true); }
          finally { btn.disabled = false; }
        });
      }

      tbody.appendChild(tr);
    });
  }

  firebase.auth().onAuthStateChanged(async function(user){
    const gate = document.getElementById('gate');
    const forbidden = document.getElementById('forbidden');
    const app = document.getElementById('app');

    if (!user || !user.emailVerified) {
      location.href = 'login.html';
      return;
    }

    currentUserEmail = user.email;
    try {
      const res = await fetch(SHEET_ENDPOINT + '?action=role&email=' + encodeURIComponent(user.email));
      const data = await res.json();
      currentUserRole = data.role || 'guest';
    } catch (err) {
      currentUserRole = 'guest';
    }

    const role = currentUserRole.toLowerCase();
    if (role !== 'admin' && role !== 'super admin') {
      gate.classList.add('hidden');
      forbidden.style.display = 'block';
      return;
    }

    gate.classList.add('hidden');
    app.classList.remove('hidden');
    document.getElementById('myRoleBadge').textContent = currentUserRole;
    if (role === 'super admin') {
      document.getElementById('pageDesc').textContent = '가입 신청 현황을 승인하고, 다른 회원에게 admin 권한을 부여할 수 있습니다.';
    }
    loadMembers();
  });

  document.getElementById('logoutBtn').addEventListener('click', function(){
    firebase.auth().signOut().then(function(){
      location.href = 'login.html';
    });
  });
</script>

</body>
</html>
